[package]
name = "pokemonsay"
version = "0.1.3"
edition = "2024"
description = "Pokemon version of cowsay"
license = "MIT"
repository = "https://github.com/dfrankland/pokemonsay"
documentation = "https://docs.rs/pokemonsay"
readme = "README.md"
categories = ["command-line-utilities"]
keywords = ["cowsay", "customization", "fortune", "terminal", "pokemon"]
include = ["*.rs", "result/db.sqlite3"]

[dependencies]
anyhow = "1.0.104"
bytes = { version = "1.12.1" }
clap = { version = "4.6.7", features = ["derive", "env"] }
image = "0.25.10"
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["json"] }
sea-orm = { version = "2.0.4", features = [
  "sqlx-sqlite",
  "runtime-tokio-rustls",
  "macros",
] }
serde = "1.0.229"
serde_json = "1.0.154"
tinytemplate = "1.2.1"
tokio = { version = "1.54.1", features = ["full"] }
viuer = { version = "0.11.0", features = ["icy_sixel"] }

[build-dependencies]
glob = "0.3.4"

[features]
default = ["embed-db"]
embed-db = []
embed-sprites = []
